<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Sazsyrnaj Matematikalyq Sintetizator</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #fdfaf6; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #c4a482; background: #d7b899; }
    button:active { background: #b89776; }
  </style>
</head>
<body>

  <h2>Sazsyrnaj: Matematikalyq Tolqyn Eksperimenti</h2>
  <p>Tómendegi batyrmany basyp túrynyz (fajlsyz, taza eseppen shyghatyn dybys):</p>
  <button id="playBtn">Dybysty qosu (Üfleu)</button>

  <script>
    let audioCtx = null;
    let osc = null;
    let noiseNode = null;
    let masterGain = null;

    function startSazsyrnaj(freq = 440) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Master dybys retteuishi
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.1); // Zhúmsaq üfleu bastaluy
      masterGain.connect(audioCtx.destination);

      // 1. Negizgi ton (Sine tolqyny)
      osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // 2. Üfleu zheli (Matematikalyq Aq Shw generatori)
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1; // Eseptik aq shw
      }

      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;

      // Zhelding zhiiligin súzgiden ótkizu (Aua sybyry)
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(freq * 1.5, audioCtx.currentTime);
      noiseFilter.Q.setValueAtTime(3, audioCtx.currentTime);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.12, audioCtx.currentTime); // Zhel dybysyn kómekshi etu

      noiseNode.connect(noiseFilter);
      noiseFilter.connect(noiseGain);

      // Tolqyndardy qosu
      osc.connect(masterGain);
      noiseGain.connect(masterGain);

      osc.start();
      noiseNode.start();
    }

    function stopSazsyrnaj() {
      if (masterGain && audioCtx) {
        masterGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); // Zhúmsaq bәsendeu
        setTimeout(() => {
          if (osc) { osc.stop(); osc.disconnect(); }
          if (noiseNode) { noiseNode.stop(); noiseNode.disconnect(); }
        }, 150);
      }
    }

    const btn = document.getElementById('playBtn');
    btn.addEventListener('mousedown', () => startSazsyrnaj(523.25)); // 'Do' (C5) zhiiligi
    btn.addEventListener('mouseup', stopSazsyrnaj);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startSazsyrnaj(523.25); });
    btn.addEventListener('touchend', stopSazsyrnaj);
  </script>
</body>
</html>
