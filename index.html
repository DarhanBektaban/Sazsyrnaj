<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таза Қоңыр Сазсырнай</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #241408, #0a0502);
      color: #ebd5bf;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { margin: 0 0 4px 0; font-size: 26px; color: #dfaf82; }
    p { margin: 0 0 25px 0; color: #a4856a; font-size: 14px; text-align: center; }

    .instrument {
      position: relative;
      width: 330px;
      height: 195px;
      background: radial-gradient(circle at 35% 30%, #9e5b2f, #542b10 70%, #2f1404 100%);
      border-radius: 130px 45px 110px 130px;
      box-shadow: inset -8px -8px 25px rgba(0,0,0,0.85), inset 6px 6px 15px rgba(255,255,255,0.12), 0 25px 50px rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #4a240c;
    }

    .mouthpiece {
      position: absolute;
      left: -25px;
      width: 35px;
      height: 42px;
      background: #361705;
      border-radius: 8px 0 0 8px;
    }

    .holes {
      display: flex;
      gap: 12px;
      z-index: 2;
    }

    .hole {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, #180902, #000);
      box-shadow: inset 2px 2px 6px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #2b1305;
      transition: transform 0.08s, box-shadow 0.08s;
      touch-action: manipulation;
    }

    .hole:active, .hole.active {
      transform: scale(0.92);
      box-shadow: 0 0 16px rgba(223, 175, 130, 0.75), inset 0 0 6px #dfaf82;
      border-color: #dfaf82;
    }

    .note-name { font-size: 11px; font-weight: bold; color: #eed5be; pointer-events: none; }
    .key-hint { font-size: 9px; color: #8e6848; pointer-events: none; }
    .status { margin-top: 25px; font-size: 13px; color: #b38a67; min-height: 20px; }
  </style>
</head>
<body>

  <h1>Қоңыр Сазсырнай</h1>
  <p>Жұмсақ акустика (клиппинг пен цифрлық сықырсыз)</p>

  <div class="instrument">
    <div class="mouthpiece"></div>
    <div class="holes">
      <div class="hole" data-freq="523.25" data-key="a"><span class="note-name">До</span><span class="key-hint">A</span></div>
      <div class="hole" data-freq="587.33" data-key="s"><span class="note-name">Ре</span><span class="key-hint">S</span></div>
      <div class="hole" data-freq="659.25" data-key="d"><span class="note-name">Ми</span><span class="key-hint">D</span></div>
      <div class="hole" data-freq="698.46" data-key="f"><span class="note-name">Фа</span><span class="key-hint">F</span></div>
      <div class="hole" data-freq="783.99" data-key="g"><span class="note-name">Соль</span><span class="key-hint">G</span></div>
      <div class="hole" data-freq="880.00" data-key="h"><span class="note-name">Ля</span><span class="key-hint">H</span></div>
      <div class="hole" data-freq="987.77" data-key="j"><span class="note-name">Си</span><span class="key-hint">J</span></div>
    </div>
  </div>

  <div class="status" id="statusText">Компьютерде: A, S, D, F, G, H, J пернелері</div>

  <script>
    let audioCtx = null;
    let compressor = null;
    let masterOut = null;
    let reverbGain = null;
    const activeNotes = new Map();

    function createReverbBuffer(ctx, duration = 1.4, decay = 2.2) {
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * duration;
      const impulse = ctx.createBuffer(2, length, sampleRate);
      for (let channel = 0; channel < 2; channel++) {
        const data = impulse.getChannelData(channel);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
      }
      return impulse;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 1. Акустикалық компрессор: дыбыс көлемі асқанда цифрлық сықырды жояды
        compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-18, audioCtx.currentTime);
        compressor.knee.setValueAtTime(12, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
        compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
        compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

        masterOut = audioCtx.createGain();
        masterOut.gain.value = 0.7;

        // 2. Жаңғырық
        const reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = createReverbBuffer(audioCtx);

        reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.25;

        // Байланыстар: Master -> Compressor -> Шығыс
        masterOut.connect(compressor);
        masterOut.connect(reverbNode);
        reverbNode.connect(reverbGain);
        reverbGain.connect(compressor);
        compressor.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startVoice(freq, id) {
      initAudio();
      if (activeNotes.has(id)) return;

      const now = audioCtx.currentTime;

      // 1. Негізгі саз үні (Sine)
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 0.99, now);
      osc.frequency.exponentialRampToValueAtTime(freq, now + 0.04);

      // Демнің нәзік тербелісі
      const vibrato = audioCtx.createOscillator();
      const vibratoGain = audioCtx.createGain();
      vibrato.frequency.value = 5.0;
      vibratoGain.gain.value = freq * 0.006;
      vibrato.connect(osc.frequency);
      vibrato.start(now);

      // 2. Саз резонаторы (600 Гц жылылығы)
      const clayFilter = audioCtx.createBiquadFilter();
      clayFilter.type = 'peaking';
      clayFilter.frequency.setValueAtTime(620, now);
      clayFilter.Q.setValueAtTime(1.8, now);
      clayFilter.gain.setValueAtTime(4.0, now);

      // Жоғарғы жасанды жиілікті шектеу (Lowpass)
      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(1400, now);

      // 3. Жұмсақ, майда үрлеу ауасы (Өткір сықырсыз)
      const bufSize = audioCtx.sampleRate * 1;
      const noiseBuffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(freq * 1.3, now);
      noiseFilter.Q.setValueAtTime(2.0, now);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.045, now); // Өте майда, табиғи үрлеу

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);

      // 4. Тіл қағудың жұмсақ екпіні
      const attackNoise = audioCtx.createBufferSource();
      const attBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.03, audioCtx.sampleRate);
      const attData = attBuf.getChannelData(0);
      for(let i=0; i<attData.length; i++) attData[i] = (Math.random()*2 - 1) * (1 - i/attData.length);
      attackNoise.buffer = attBuf;
      const attackGain = audioCtx.createGain();
      attackGain.gain.setValueAtTime(0.08, now);
      attackNoise.connect(attackGain);

      // Дыбыстың шығуы мен күші
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.setValueAtTime(0.001, now);
      voiceGain.gain.exponentialRampToValueAtTime(0.4, now + 0.06);

      osc.connect(clayFilter);
      clayFilter.connect(lowpass);
      lowpass.connect(voiceGain);

      noiseGain.connect(voiceGain);
      attackGain.connect(voiceGain);
      voiceGain.connect(masterOut);

      osc.start(now);
      attackNoise.start(now);
      noise.start(now);

      activeNotes.set(id, { osc, vibrato, noise, voiceGain });
      updateMasterGain();
    }

    // Бірнеше тесік басылғанда дауысты автоматты жұмсарту (Клиппингтің алдын алу)
    function updateMasterGain() {
      if (!masterOut) return;
      const count = activeNotes.size;
      const targetGain = count > 1 ? 0.7 / Math.sqrt(count) : 0.7;
      masterOut.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.03);
    }

    function stopVoice(id) {
      if (!activeNotes.has(id)) return;
      const { osc, vibrato, noise, voiceGain } = activeNotes.get(id);
      const now = audioCtx.currentTime;

      voiceGain.gain.setValueAtTime(voiceGain.gain.value, now);
      voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

      setTimeout(() => {
        try {
          osc.stop(); vibrato.stop(); noise.stop();
          osc.disconnect(); vibrato.disconnect(); noise.disconnect();
          voiceGain.disconnect();
        } catch (e) {}
      }, 140);

      activeNotes.delete(id);
      updateMasterGain();
    }

    // Оқиғалар
    const holes = document.querySelectorAll('.hole');
    holes.forEach((hole, index) => {
      const freq = parseFloat(hole.dataset.freq);
      const id = 'h-' + index;

      const onStart = (e) => { e.preventDefault(); hole.classList.add('active'); startVoice(freq, id); };
      const onEnd = (e) => { e.preventDefault(); hole.classList.remove('active'); stopVoice(id); };

      hole.addEventListener('mousedown', onStart);
      hole.addEventListener('mouseup', onEnd);
      hole.addEventListener('mouseleave', onEnd);
      hole.addEventListener('touchstart', onStart, { passive: false });
      hole.addEventListener('touchend', onEnd, { passive: false });
    });

    const keyMap = {};
    holes.forEach((hole, i) => {
      keyMap[hole.dataset.key] = { freq: parseFloat(hole.dataset.freq), id: 'h-' + i, el: hole };
    });

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (keyMap[k] && !activeNotes.has(keyMap[k].id)) {
        keyMap[k].el.classList.add('active');
        startVoice(keyMap[k].freq, keyMap[k].id);
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (keyMap[k]) {
        keyMap[k].el.classList.remove('active');
        stopVoice(keyMap[k].id);
      }
    });
  </script>
</body>
</html>
