<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Акустикалық Сазсырнай (Pro Үн)</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #26160b, #0d0703);
      color: #f5ebe0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { margin: 0 0 6px 0; font-size: 26px; color: #e0b488; }
    p { margin: 0 0 25px 0; color: #a98d73; font-size: 14px; text-align: center; }

    /* Сазсырнай корпусы */
    .instrument {
      position: relative;
      width: 330px;
      height: 190px;
      background: radial-gradient(circle at 35% 30%, #a46436, #532c11 75%, #311706 100%);
      border-radius: 130px 45px 110px 130px;
      box-shadow: inset -8px -8px 25px rgba(0,0,0,0.8), inset 6px 6px 15px rgba(255,255,255,0.15), 0 25px 45px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #4a270f;
    }

    .mouthpiece {
      position: absolute;
      left: -26px;
      width: 36px;
      height: 42px;
      background: #381a08;
      border-radius: 8px 0 0 8px;
    }

    .holes {
      display: flex;
      gap: 12px;
      z-index: 2;
    }

    .hole {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, #1a0a03, #000);
      box-shadow: inset 2px 2px 6px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #2e1708;
      transition: transform 0.08s, box-shadow 0.08s;
      touch-action: manipulation;
    }

    .hole:active, .hole.active {
      transform: scale(0.92);
      box-shadow: 0 0 16px rgba(224, 180, 136, 0.75), inset 0 0 6px #e0b488;
      border-color: #e0b488;
    }

    .note-name { font-size: 11px; font-weight: bold; color: #ebd1b5; pointer-events: none; }
    .key-hint { font-size: 9px; color: #8f6c4d; pointer-events: none; }
    .status { margin-top: 25px; font-size: 13px; color: #b89270; min-height: 20px; }
  </style>
</head>
<body>

  <h1>Акустикалық Сазсырнай</h1>
  <p>Жақсартылған кеңістік пен саз үні. 2-3 тесікті қатар басып көріңіз.</p>

  <div class="instrument">
    <div class="mouthpiece"></div>
    <div class="holes">
      <div class="hole" data-freq="523.25" data-key="a"><span class="note-name">До</span><span class="key-hint">A</span></div>
      <div class="hole" data-freq="587.33" data-key="s"><span class="note-name">Ре</span><span class="key-hint">S</span></div>
      <div class="hole" data-freq="659.25" data-key="d"><span class="note-name">Ми</span><span class="key-hint">D</span></div>
      <div class="hole" data-freq="698.46" data-key="f"><span class="note-name">Фа</span><span class="key-hint">F</span></div>
      <div class="hole" data-freq="783.99" data-key="g"><span class="note-name">Соль</span><span class="key-hint">G</span></div>
      <div class="hole" data-freq="880.00" data-key="h"><span class="note-name">Ля</span><span class="key-hint">H</span></div>
      <div class="hole" data-freq="987.77" data-key="j"><span class="note-name">Си</span><span class="key-hint">J</span></div>
    </div>
  </div>

  <div class="status" id="statusText">Компьютерде: A, S, D, F, G, H, J пернелері</div>

  <script>
    let audioCtx = null;
    let reverbNode = null;
    let masterOut = null;
    const activeNotes = new Map();

    // Саз қабырғасының жұмсақ тембрі (Saturation Curve)
    function makeDistortionCurve(amount = 20) {
      const k = amount;
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        let x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    // Кеңістік жаңғырығы (Синтетикалық импульс — Күмбез/Мазар)
    function createReverbBuffer(ctx, duration = 1.8, decay = 2.5) {
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * duration;
      const impulse = ctx.createBuffer(2, length, sampleRate);
      for (let channel = 0; channel < 2; channel++) {
        const channelData = impulse.getChannelData(channel);
        for (let i = 0; i < length; i++) {
          channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
      }
      return impulse;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Негізгі шығыс
        masterOut = audioCtx.createGain();
        masterOut.gain.value = 0.8;

        // Реверберация желісі
        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = createReverbBuffer(audioCtx, 1.8, 2.8);

        const reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.35; // Жаңғырық күші

        masterOut.connect(audioCtx.destination);
        masterOut.connect(reverbNode);
        reverbNode.connect(reverbGain);
        reverbGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startVoice(freq, id) {
      initAudio();
      if (activeNotes.has(id)) return;

      const now = audioCtx.currentTime;
      const isMulti = activeNotes.size >= 1; // Бірнеше тесік қатар басылған ба?

      // 1. Негізгі тондар (Sine + жеңіл Triangle үндестігі)
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      const oscSub = audioCtx.createOscillator();
      oscSub.type = 'triangle';
      oscSub.frequency.setValueAtTime(freq, now);

      // 2. Саз жылулығы сүзгісі (Lowpass)
      const bodyFilter = audioCtx.createBiquadFilter();
      bodyFilter.type = 'lowpass';
      bodyFilter.frequency.setValueAtTime(isMulti ? 2200 : 1600, now); // Бірнешеу болса сықыр өткірлейді

      // 3. Үрлеу ауасы (Ақ шу)
      const bufSize = audioCtx.sampleRate * 1;
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      // Егер 2-3 ойық қатар басылса, жиілік ауытқып, ысқырық қосылады
      noiseFilter.frequency.setValueAtTime(isMulti ? freq * 2.8 : freq * 1.5, now);
      noiseFilter.Q.setValueAtTime(isMulti ? 7 : 3.5, now);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(isMulti ? 0.22 : 0.08, now); // Сықыр мен шудың күшеюі

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);

      // 4. Жұмсақ қанығу (WaveShaper)
      const shaper = audioCtx.createWaveShaper();
      shaper.curve = makeDistortionCurve(isMulti ? 35 : 12);
      shaper.oversample = '2x';

      // Дыбысты біріктіру
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.setValueAtTime(0.001, now);
      voiceGain.gain.exponentialRampToValueAtTime(0.45, now + 0.07);

      osc.connect(bodyFilter);
      oscSub.connect(bodyFilter);
      bodyFilter.connect(shaper);
      shaper.connect(voiceGain);
      noiseGain.connect(voiceGain);

      voiceGain.connect(masterOut);

      osc.start(now);
      oscSub.start(now);
      noise.start(now);

      activeNotes.set(id, { osc, oscSub, noise, voiceGain, isMulti });

      if (activeNotes.size > 1) {
        document.getElementById('statusText').innerText = 'Ауа турбуленттілігі (Сықыр/Overblowing қосылды)';
      }
    }

    function stopVoice(id) {
      if (!activeNotes.has(id)) return;
      const { osc, oscSub, noise, voiceGain } = activeNotes.get(id);
      const now = audioCtx.currentTime;

      voiceGain.gain.setValueAtTime(voiceGain.gain.value, now);
      voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

      setTimeout(() => {
        try {
          osc.stop(); oscSub.stop(); noise.stop();
          osc.disconnect(); oscSub.disconnect(); noise.disconnect();
          voiceGain.disconnect();
        } catch (e) {}
      }, 160);

      activeNotes.delete(id);
      if (activeNotes.size <= 1) {
        document.getElementById('statusText').innerText = 'Компьютерде: A, S, D, F, G, H, J пернелері';
      }
    }

    // Түймелерге оқиғаларды қосу
    const holes = document.querySelectorAll('.hole');
    holes.forEach((hole, index) => {
      const freq = parseFloat(hole.dataset.freq);
      const id = 'h-' + index;

      const onStart = (e) => {
        e.preventDefault();
        hole.classList.add('active');
        startVoice(freq, id);
      };
      const onEnd = (e) => {
        e.preventDefault();
        hole.classList.remove('active');
        stopVoice(id);
      };

      hole.addEventListener('mousedown', onStart);
      hole.addEventListener('mouseup', onEnd);
      hole.addEventListener('mouseleave', onEnd);
      hole.addEventListener('touchstart', onStart, { passive: false });
      hole.addEventListener('touchend', onEnd, { passive: false });
    });

    // Пернетақта
    const keyMap = {};
    holes.forEach((hole, i) => {
      keyMap[hole.dataset.key] = { freq: parseFloat(hole.dataset.freq), id: 'h-' + i, el: hole };
    });

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (keyMap[k] && !activeNotes.has(keyMap[k].id)) {
        keyMap[k].el.classList.add('active');
        startVoice(keyMap[k].freq, keyMap[k].id);
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (keyMap[k]) {
        keyMap[k].el.classList.remove('active');
        stopVoice(keyMap[k].id);
      }
    });
  </script>
</body>
</html>
